name: basalt

# Canonical channel names keep this file portable. The China-mainland installer
# renders temporary mirror URLs and never modifies the user's global .condarc.
channels:
  - conda-forge
  - bioconda
  - nodefaults

dependencies:
  - python=3.12

  # Core bioinformatics command-line tools
  - megahit
  - metabat2
  - maxbin2
  - concoct
  - prodigal
  - semibin
  - bedtools
  - blast
  - bowtie2
  - bwa
  - diamond
  - checkm2
  - unicycler
  - spades
  - samtools
  - racon
  - pplacer
  - pilon
  - minimap2
  - miniasm
  - idba
  - hmmer
  - entrez-direct

  # Python runtime. Keep the scientific stack in the Conda transaction so a
  # second package manager cannot replace it with incompatible GPU wheels.
  - biopython
  - pytorch=2.4.*=cpu_generic*
  - nomkl
  - tensorboardx
  - scikit-learn
  - numpy=1.26.4
  - scipy
  - pandas>=2.2,<3
  - matplotlib-base
  - pillow
  - joblib
  - tqdm
  - requests
  - huggingface_hub

  # Installers retained for optional, separately validated adapters.
  - pip
  - uv
