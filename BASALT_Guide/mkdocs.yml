site_name: BASALT
site_description: Reproducible installation and use of the BASALT metagenomic binning and refinement workflow
site_author: PKU-EMBL Laboratory
site_url: !ENV [READTHEDOCS_CANONICAL_URL, ""]

repo_name: PKU-EMBL/BASALT
repo_url: https://github.com/PKU-EMBL/BASALT
edit_uri: edit/master/BASALT_Guide/docs/
copyright: Copyright &copy; PKU-EMBL Laboratory 2023–2026

docs_dir: docs
site_dir: site
strict: true

nav:
  - Overview: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Tutorial: tutorial.md
  - User guide:
      - Inputs and study design: inputs.md
      - Command-line reference: usage.md
      - Pipeline and methods: pipeline.md
      - Outputs and quality control: output.md
      - Extra binners: extra-binners.md
  - Reproducibility and reporting: reproducibility.md
  - Help:
      - Troubleshooting and FAQ: faq.md
      - Release notes: release-notes.md
  - Developer reference: api/index.md

theme:
  name: material
  custom_dir: docs/overrides
  logo: img/pku-embl-logo.png
  favicon: img/pku-embl-logo.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/readthedocs.js

extra_css:
  - css/custom.css
