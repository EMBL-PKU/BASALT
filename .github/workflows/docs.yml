name: Documentation

on:
  pull_request:
    paths:
      - ".readthedocs.yaml"
      - "README.md"
      - "BASALT_Guide/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - master
    paths:
      - ".readthedocs.yaml"
      - "README.md"
      - "BASALT_Guide/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  strict-sphinx-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BASALT_Guide/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r BASALT_Guide/requirements.txt

      - name: Build documentation with warnings as errors
        run: >-
          sphinx-build -W --keep-going -b html
          BASALT_Guide/docs .build/basalt-guide
